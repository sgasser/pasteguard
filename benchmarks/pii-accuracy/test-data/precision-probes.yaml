# Precision probes across 7 languages: text with NO real PII but tempting
# common nouns / weekdays / role words that NER tends to over-tag. expected: []
# means any detection is a false positive. category: hard (these measure limits);
# split mixed so the dev split carries FP signal for threshold calibration.

test_cases:
  - id: probe_de_roles
    text: "Der Kunde wünscht eine schnelle Lieferung bis Montag."
    language: de
    category: hard
    split: dev
    expected: []

  - id: probe_de_commonnoun
    text: "Die Bank am Markt hat heute leider geschlossen."
    language: de
    category: hard
    split: test
    expected: []

  - id: probe_it_roles
    text: "Il cliente ha richiesto la fattura entro venerdì."
    language: it
    category: hard
    split: dev
    expected: []

  - id: probe_fr_roles
    text: "Le client souhaite un rendez-vous la semaine prochaine."
    language: fr
    category: hard
    split: test
    expected: []

  - id: probe_es_roles
    text: "El cliente solicita la factura del mes corriente."
    language: es
    category: hard
    split: dev
    expected: []

  - id: probe_en_commonnoun
    text: "The board approved the budget on Friday afternoon."
    language: en
    category: hard
    split: test
    expected: []

  - id: probe_en_caps
    text: "Please File the report under Section Five before noon."
    language: en
    category: hard
    split: dev
    expected: []

  - id: probe_nl_roles
    text: "De klant vraagt om een snelle levering deze week."
    language: nl
    category: hard
    split: test
    expected: []

  - id: probe_pt_roles
    text: "O cliente pediu a fatura até sexta-feira."
    language: pt
    category: hard
    split: dev
    expected: []
