cases:
  - id: hard_ipv6_full
    suite: hard
    category: hard
    split: test
    language: en
    text: "The IPv6 source address was 2001:0db8:85a3:0000:0000:8a2e:0370:7334."
    expected:
      - entity: IP_ADDRESS
        text: 2001:0db8:85a3:0000:0000:8a2e:0370:7334
        match: exact

  - id: hard_ipv6_compressed
    suite: hard
    category: hard
    split: test
    language: en
    text: "The compressed IPv6 address is 2001:db8::8a2e:370:7334."
    expected:
      - entity: IP_ADDRESS
        text: 2001:db8::8a2e:370:7334
        match: exact

  - id: hard_email_inside_sentence
    suite: hard
    category: hard
    split: test
    language: en
    text: "Please email alice.smith+billing@example.co.uk, not the shared inbox."
    expected:
      - entity: EMAIL_ADDRESS
        text: alice.smith+billing@example.co.uk
        match: exact

  - id: hard_name_lowercase
    suite: hard
    category: hard
    split: test
    language: en
    text: "The note says john smith can approve only read-only access."
    expected:
      - entity: PERSON
        text: john smith
        match: contains

  - id: hard_name_lowercase_it
    suite: hard
    category: hard
    split: test
    language: it
    text: "ricorda di chiamare mario rossi per la fattura"
    expected:
      - entity: PERSON
        text: mario rossi
        match: contains

  - id: hard_person_hyphenated
    suite: hard
    category: hard
    split: test
    language: en
    text: "Anne-Marie Johnson approved the vendor exception."
    expected:
      - entity: PERSON
        text: Anne-Marie Johnson
        match: contains

  - id: hard_phone_international_uk
    suite: hard
    category: hard
    split: test
    language: en
    text: "The London callback number is +44 20 7946 0958."
    expected:
      - entity: PHONE_NUMBER
        text: +44 20 7946 0958
        match: contains

  - id: hard_location_ambiguous_city
    suite: hard
    category: hard
    split: test
    language: en
    text: "The request mentions Reading as the office location."
    expected:
      - entity: LOCATION
        text: Reading
        match: contains

  - id: hard_address_street_de
    suite: hard
    category: hard
    split: test
    language: de
    entities: [LOCATION]
    text: "Die Lieferadresse lautet Bahnhofstraße 12."
    expected:
      - entity: LOCATION
        text: Bahnhofstraße 12
        match: contains

  - id: hard_address_full_de
    suite: hard
    category: hard
    split: test
    language: de
    entities: [LOCATION]
    text: "Die Lieferadresse lautet Bahnhofstraße 12, 10115 Berlin."
    expected:
      - entity: LOCATION
        text: Bahnhofstraße 12, 10115 Berlin
        match: contains

  - id: hard_address_full_en
    suite: hard
    category: hard
    split: test
    language: en
    entities: [LOCATION]
    text: "Ship the order to 1600 Pennsylvania Avenue, Washington."
    expected:
      - entity: LOCATION
        text: 1600 Pennsylvania Avenue, Washington
        match: contains

  - id: hard_address_full_fr
    suite: hard
    category: hard
    split: test
    language: fr
    entities: [LOCATION]
    text: "L'adresse de livraison est 25 Rue du Faubourg Saint-Honoré, Paris."
    expected:
      - entity: LOCATION
        text: 25 Rue du Faubourg Saint-Honoré, Paris
        match: contains

  - id: hard_private_url_without_scheme
    suite: hard
    category: hard
    split: dev
    language: en
    backends: [openai_privacy_filter]
    text: "The private patient record is at portal.example.test/patients/Morgan-Lee."
    expected:
      - entity: URL
        text: portal.example.test/patients/Morgan-Lee
        match: exact

  - id: hard_private_date_natural_language
    suite: hard
    category: hard
    split: dev
    language: en
    backends: [openai_privacy_filter]
    text: "The patient's confidential appointment is next Thursday at 09:30."
    expected:
      - entity: DATE_TIME
        text: next Thursday at 09:30
        match: contains

  - id: hard_account_number_alphanumeric
    suite: hard
    category: hard
    split: dev
    language: en
    backends: [openai_privacy_filter]
    text: "The customer's internal billing account is ACCT-0042-8891."
    expected:
      - entity: ACCOUNT_NUMBER
        text: ACCT-0042-8891
        match: exact

  - id: hard_contextual_secret_phrase
    suite: hard
    category: hard
    split: dev
    language: en
    backends: [openai_privacy_filter]
    text: "For emergency access, the confidential phrase is blue door at dawn."
    expected:
      - entity: SECRET
        text: blue door at dawn
        match: contains
