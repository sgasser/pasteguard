services:
  pasteguard:
    image: ghcr.io/sgasser/pasteguard:${PASTEGUARD_TAG:-latest}
    build:
      context: .
      args:
        LANGUAGES: ${LANGUAGES:-en}
    ports:
      - "3000:3000"
    environment:
      - PASTEGUARD_LANGUAGES=${PASTEGUARD_LANGUAGES:-}
    volumes:
      - pasteguard-data:/app/data
      # Optional: mount custom config
      # - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  # Development: Presidio only (for local Bun with hot-reload)
  presidio:
    profiles: ["dev"]
    image: ghcr.io/sgasser/pasteguard:${PASTEGUARD_TAG:-latest}
    build:
      context: .
      args:
        LANGUAGES: ${LANGUAGES:-en}
    ports:
      - "5002:5002"
    environment:
      - START_APP=false
      - PORT=5002
      - WORKERS=1
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pasteguard-data:
