# PasteGuard - Docker Compose
#
# Production (all-in-one: proxy + detector in one container):
#   docker compose up -d
#
# Development (detector in Docker, proxy locally with hot-reload):
#   docker compose up detector -d
#   bun run dev
#
# The published image bundles the proxy and the PII detector. The standalone
# `detector` service below exists only for local development, so the proxy can
# run from source (`bun run dev`) against it without rebuilding the full image.

services:
  pasteguard:
    image: ghcr.io/sgasser/pasteguard:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.yaml:/pasteguard/config.yaml:ro
      - ./data:/pasteguard/data
    restart: unless-stopped

  # Development only: the PII detector on its own, for `bun run dev`.
  # Point the local proxy at it with DETECTOR_URL=http://localhost:5002.
  detector:
    profiles: ["dev"]
    build:
      context: ./detector
    ports:
      - "5002:5002"
    restart: unless-stopped
