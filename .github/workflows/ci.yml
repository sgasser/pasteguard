name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "17 4 * * 1"

jobs:
  bun-audit:
    name: Bun Lockfile Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: changes
        with:
          filters: |
            audit:
              - 'bun.lock'
              - '.github/workflows/ci.yml'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: github.event_name == 'schedule' || steps.changes.outputs.audit == 'true'
        with:
          bun-version: '1.4.4'

      - name: Audit locked dependencies
        if: github.event_name == 'schedule' || steps.changes.outputs.audit == 'true'
        run: bun audit

  test:
    name: Test & Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Match the production runtime without downloading Bun during setup.
    container: oven/bun:1-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Benchmark type check
        run: bun run typecheck:benchmarks

      - name: Lint & format check
        run: bun run check

      - name: Run tests
        run: bun test

  detector:
    name: Detector Lint, Types & Tests (Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor in detector/pyproject.toml; 3.14 is what the Docker image runs.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"

      # Installs exactly the versions in uv.lock (CPU-only torch) and fails if
      # the lock does not match pyproject.toml.
      - name: Install detector
        working-directory: detector
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }} --no-python-downloads

      - name: Lint
        working-directory: detector
        run: .venv/bin/ruff check .

      - name: Format check
        working-directory: detector
        run: .venv/bin/ruff format . --check

      - name: Type check
        working-directory: detector
        run: .venv/bin/pyright --pythonversion ${{ matrix.python-version }}

      - name: Run tests
        working-directory: detector
        run: .venv/bin/python -m pytest -q

  # Branch protection requires this check name. It passes only when every
  # Python version above passed.
  detector-result:
    name: Detector Lint, Types & Tests
    if: always() && github.event_name != 'schedule'
    needs: detector
    runs-on: ubuntu-latest

    steps:
      - name: Require every detector job to pass
        env:
          RESULT: ${{ needs.detector.result }}
        run: test "$RESULT" = success

  docker-build:
    name: Docker Build and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build-result: ${{ steps.image.outcome }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the all-in-one image users actually run (proxy + detector).
      - name: Test Docker build
        id: image
        run: docker build -f docker/Dockerfile -t pasteguard:test .

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan the built image
        run: trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 pasteguard:test

  # Keep the required build check independent of vulnerability findings.
  docker-build-result:
    name: Docker Build Test
    if: always()
    needs: docker-build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the production image to build
        env:
          RESULT: ${{ needs.docker-build.outputs.build-result }}
        run: test "$RESULT" = success
