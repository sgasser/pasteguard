name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    # Match the production runtime without downloading Bun during setup.
    container: oven/bun:1-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Benchmark type check
        run: bun run typecheck:benchmarks

      - name: Lint & format check
        run: bun run check

      - name: Run tests
        run: bun test

  detector:
    name: Detector Lint, Types & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install detector
        working-directory: detector
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          # CPU-only torch so the gliner dependency does not pull the CUDA build.
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        working-directory: detector
        run: .venv/bin/ruff check .

      - name: Format check
        working-directory: detector
        run: .venv/bin/ruff format . --check

      - name: Type check
        working-directory: detector
        run: .venv/bin/pyright

      - name: Run tests
        working-directory: detector
        run: .venv/bin/python -m pytest -q

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build the all-in-one image users actually run (proxy + detector).
      - name: Test Docker build
        run: docker build -f docker/Dockerfile -t pasteguard:test .
