name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Type check benchmarks
        run: bun run typecheck:benchmarks

      - name: Lint & format check
        run: bun run check

      - name: Run tests
        run: bun test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark generator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r benchmarks/pii-accuracy/requirements.txt

      - name: Check generated benchmark corpus
        run: python benchmarks/pii-accuracy/generate.py --check

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test Docker build
        run: docker build -f docker/Dockerfile -t pasteguard:test .
